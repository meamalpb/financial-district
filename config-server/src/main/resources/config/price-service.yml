server:
  port: 8083

spring:
  data:
    mongodb:
      uri: "${MONGODB_URI}"
      database: financial-district

twelvedata:
  apikey: "${TWELVEDATA_API_KEY}"
  baseurl: "https://api.twelvedata.com/"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

custom:
  price-refresh: 1d