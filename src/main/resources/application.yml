server:
  port: 8080

spring:
  application:
    name: financial-district
  datasource:
    url: "${DATASOURCE_URL}"
    username: "${DATASOURCE_USERNAME}"
    password: "${DATASOURCE_PASSWORD}"
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      max-lifetime: 180000
      idle-timeout: 120000
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

twelvedata:
  apikey: "${TWELVEDATA_API_KEY}"
  baseurl: "https://api.twelvedata.com/"
